# Dependabot version updates. Options reference:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Root site minor and patch updates share a weekly PR. Major site updates
# get their own PRs.

version: 2

updates:
  # Astro site at the repo root. The `bun` ecosystem reads only the text
  # bun.lock, and the root still uses binary bun.lockb. The npm updater bumps
  # package.json only. Run `bun install` at the root and commit bun.lockb
  # to the dependency PR. Core runs a frozen install against that lockfile.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "A-tech-investment"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      site-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Docker and just files-test both install from package-lock.json.
  - package-ecosystem: "npm"
    directory: "/services/files"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "A-tech-investment"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      files-service:
        patterns: ["*"]

  # Base image for the services/files Dockerfile.
  - package-ecosystem: "docker"
    directory: "/services/files"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "A-tech-investment"
    commit-message:
      prefix: "build"
      include: "scope"

  # Actions pinned in .github/workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "A-tech-investment"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
