<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>{{FOLDER}} cover</title>
  <style>
    @font-face {
      font-family: Archivo;
      src: url("{{Archivo.ttf}}");
      font-weight: 800 900;
      font-display: block;
    }
    @font-face {
      font-family: JetBrains;
      src: url("{{JetBrainsMono.ttf}}");
      font-weight: 400 500;
      font-display: block;
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
    }
    body {
      background: #10192f;
      color: #f6f7fc;
      font-family: Archivo, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(
          ellipse at 94% 80%,
          #425bb640,
          transparent 58%
        ),
        radial-gradient(ellipse at 18% -22%, #5260a72b, transparent 60%);
    }
    .orbit {
      position: absolute;
      width: 530px;
      height: 530px;
      border: 1px solid #a9bdf213;
      border-radius: 50%;
      right: -160px;
      top: 120px;
    }
    .orbit:before,
    .orbit:after {
      content: "";
      position: absolute;
      border: 1px solid #a9bdf213;
      border-radius: 50%;
      inset: 48px;
    }
    .orbit:after {
      inset: 96px;
    }
    header {
      position: absolute;
      left: 72px;
      right: 72px;
      top: 55px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .identity {
      display: flex;
      gap: 17px;
      align-items: center;
    }
    header img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 50%;
      border: 1px solid #ffffff30;
    }
    .name {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
    .repo {
      font:
        14px JetBrains,
        monospace;
      color: #a5b4d2;
      margin-top: 6px;
    }
    .label {
      font:
        13px JetBrains,
        monospace;
      color: #9aaacd;
      letter-spacing: 0.12em;
    }
    main {
      position: absolute;
      left: 72px;
      top: 190px;
      right: 72px;
    }
    .eyebrow {
      color: #90b8ff;
      font:
        15px JetBrains,
        monospace;
      letter-spacing: 0.17em;
      margin-bottom: 23px;
    }
    h1 {
      font-size: 82px;
      font-weight: 900;
      line-height: 1.02;
      letter-spacing: -0.045em;
      margin: 0;
      max-height: 252px;
      white-space: pre-line;
      overflow-wrap: anywhere;
      width: 1020px;
    }
    footer {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 54px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #a9bdf226;
      padding-top: 22px;
      font:
        14px JetBrains,
        monospace;
      color: #9caecf;
    }
    .file {
      color: #d0ddf5;
    }
    .dot {
      display: inline-block;
      background: #90b8ff;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-right: 10px;
    }
  </style>
  <div class="glow"></div>
  <div class="orbit"></div>
  <header>
    <div class="identity">
      <img src="{{avatar.jpg}}" alt="" />
      <div>
        <div class="name">Unique Divine</div>
        <div class="repo">jiyuu / ai-skills</div>
      </div>
    </div>
    <div class="label">PUBLIC WORKFLOWS</div>
  </header>
  <main>
    <div class="eyebrow">AGENT SKILLS</div>
    <h1>{{TITLE}}</h1>
  </main>
  <footer>
    <span class="file"><span class="dot"></span>{{FOLDER}}</span
    ><span>uniquedivine.com/ai-skills</span>
  </footer>
</html>
