<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="evidence-map-title evidence-map-desc"><title id="evidence-map-title">What the evidence supports</title><desc id="evidence-map-desc">Phase counters support pooled elapsed-time means. Whole-second event logs support lifecycle timing. Headers support canonical cadence. Missing states, restart gaps, and precision limits remain explicit.</desc><defs><marker id="evidence-map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58686f"/></marker></defs><rect width="1200" height="720" fill="#f7f5ef"/><g font-family="Inter, Arial, sans-serif"><text x="48" y="48" font-size="16" fill="#126f67" font-weight="bold">EVIDENCE GUIDE</text><text x="48" y="104" font-size="34" fill="#202f36" font-weight="bold">Use each source for the question it can answer</text><rect x="48" y="165" width="356" height="145" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="48" y="181" width="5" height="113" rx="2" fill="#16857b"/><text x="66" y="201" font-size="22" fill="#202f36" font-weight="bold">Phase counters</text><text x="66" y="237" font-size="18" fill="#58686f" font-weight="normal">Elapsed-time sum + visit count</text><text x="66" y="263" font-size="18" fill="#58686f" font-weight="normal">Sampled every 60 seconds</text><path d="M226 312 L226 357" fill="none" stroke="#58686f" stroke-width="2" marker-end="url(#evidence-map-arrow)"/><rect x="422" y="165" width="356" height="145" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="422" y="181" width="5" height="113" rx="2" fill="#c88821"/><text x="440" y="201" font-size="22" fill="#202f36" font-weight="bold">Node event logs</text><text x="440" y="237" font-size="18" fill="#58686f" font-weight="normal">Lifecycle markers + heights</text><text x="440" y="263" font-size="18" fill="#58686f" font-weight="normal">Whole-second event precision</text><path d="M600 312 L600 357" fill="none" stroke="#58686f" stroke-width="2" marker-end="url(#evidence-map-arrow)"/><rect x="796" y="165" width="356" height="145" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="796" y="181" width="5" height="113" rx="2" fill="#3e71a3"/><text x="814" y="201" font-size="22" fill="#202f36" font-weight="bold">Canonical headers</text><text x="814" y="237" font-size="18" fill="#58686f" font-weight="normal">Consecutive block times</text><text x="814" y="263" font-size="18" fill="#58686f" font-weight="normal">Previous-height vote timestamps</text><path d="M974 312 L974 357" fill="none" stroke="#58686f" stroke-width="2" marker-end="url(#evidence-map-arrow)"/><rect x="48" y="360" width="356" height="157" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="48" y="376" width="5" height="125" rx="2" fill="#16857b"/><text x="66" y="396" font-size="22" fill="#202f36" font-weight="bold">Phase means</text><text x="66" y="432" font-size="18" fill="#58686f" font-weight="normal">Counter deltas ÷ block count</text><text x="66" y="458" font-size="18" fill="#58686f" font-weight="normal">Millisecond means are supported</text><text x="66" y="484" font-size="18" fill="#58686f" font-weight="normal">Individual-block p99 is not</text><rect x="422" y="360" width="356" height="157" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="422" y="376" width="5" height="125" rx="2" fill="#c88821"/><text x="440" y="396" font-size="22" fill="#202f36" font-weight="bold">Upgrade lifecycle</text><text x="440" y="432" font-size="18" fill="#58686f" font-weight="normal">Stop, start, handshake, commit</text><text x="440" y="458" font-size="18" fill="#58686f" font-weight="normal">Can locate the restart gap</text><text x="440" y="484" font-size="18" fill="#58686f" font-weight="normal">Cannot resolve 150 ms voting</text><rect x="796" y="360" width="356" height="157" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="796" y="376" width="5" height="125" rx="2" fill="#3e71a3"/><text x="814" y="396" font-size="22" fill="#202f36" font-weight="bold">Chain cadence</text><text x="814" y="432" font-size="18" fill="#58686f" font-weight="normal">Canonical interval and height</text><text x="814" y="458" font-size="18" fill="#58686f" font-weight="normal">Gap can appear at H+2</text><text x="814" y="484" font-size="18" fill="#58686f" font-weight="normal">Not the local halt duration</text><text x="48" y="580" font-size="25" fill="#202f36" font-weight="bold">Read gaps honestly</text><text x="48" y="620" font-size="22" fill="#58686f" font-weight="normal">A stopped process records no phase time. Restart-crossing counters are incomplete.</text><text x="48" y="658" font-size="22" fill="#58686f" font-weight="normal">Absent series ≠ zero. Coarse buckets ≠ subsecond percentiles. Ingestion time ≠ event precision.</text></g></svg>