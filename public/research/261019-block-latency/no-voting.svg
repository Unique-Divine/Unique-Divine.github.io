  <g id="no-voting-text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58686f" x="707.616" y="102.816" transform="rotate(-0 707.616 102.816)">Commit</text>
  </g>
  <g id="no-voting-text_20">
   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202f36" x="34.56" y="352.512" transform="rotate(-0 34.56 352.512)">Subtract 324.85 ms, or 21.44% of the measured interval.</text>
  </g>
  <g id="no-voting-text_21">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #202f36" x="34.56" y="386.784" transform="rotate(-0 34.56 386.784)">This is arithmetic, not a safe protocol patch or a measured sequencer result.</text>
  </g>
  <g id="no-voting-text_22">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #58686f" x="34.56" y="416.16" transform="rotate(-0 34.56 416.16)">A sequencer chooses transaction order. It still needs a defined path for execution, replication, and confirmation.</text>
  </g>
  <g id="no-voting-text_23">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #58686f" transform="translate(34.56 454.016)">Other phases, scheduling, and the signed residual +0.08 ms are held fixed. A replacement can change all of them.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #58686f" transform="translate(34.56 470.016)">No guaranteed speedup follows from removing steps. </text>
  </g>
