<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="block-cycle-title block-cycle-desc"><title id="block-cycle-title">The block cycle</title><desc id="block-cycle-desc">A schematic of NewHeight, NewRound, Propose, Prevote, Precommit, and Commit. The next height repeats the cycle. User-visible result delivery is a separate measurement.</desc><defs><marker id="block-cycle-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#58686f"/></marker></defs><rect width="1200" height="720" fill="#f7f5ef"/><g font-family="Inter, Arial, sans-serif"><text x="48" y="48" font-size="16" fill="#126f67" font-weight="bold">SUCCESSFUL-ROUND FLOW</text><text x="48" y="104" font-size="36" fill="#202f36" font-weight="bold">One successful consensus round</text><text x="48" y="145" font-size="21" fill="#58686f" font-weight="normal">These local states are what the phase counters measure. A failed round can repeat the voting path.</text><rect x="48" y="205" width="170" height="142" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="48" y="221" width="5" height="110" rx="2" fill="#84949d"/><text x="66" y="241" font-size="22" fill="#202f36" font-weight="bold">NewHeight</text><text x="66" y="277" font-size="18" fill="#58686f" font-weight="normal">Remaining</text><text x="66" y="303" font-size="18" fill="#58686f" font-weight="normal">scheduled wait</text><path d="M219 276 L233 276" fill="none" stroke="#58686f" stroke-width="2" marker-end="url(#block-cycle-arrow)"/><rect x="235" y="205" width="170" height="142" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="235" y="221" width="5" height="110" rx="2" fill="#bac5c8"/><text x="253" y="241" font-size="22" fill="#202f36" font-weight="bold">NewRound</text><text x="253" y="277" font-size="18" fill="#58686f" font-weight="normal">Set up the</text><text x="253" y="303" font-size="18" fill="#58686f" font-weight="normal">round</text><path d="M406 276 L420 276" fill="none" stroke="#58686f" stroke-width="2" marker-end="url(#block-cycle-arrow)"/><rect x="422" y="205" width="170" height="142" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="422" y="221" width="5" height="110" rx="2" fill="#c88821"/><text x="440" y="241" font-size="22" fill="#202f36" font-weight="bold">Propose</text><text x="440" y="277" font-size="18" fill="#58686f" font-weight="normal">Obtain and</text><text x="440" y="303" font-size="18" fill="#58686f" font-weight="normal">check proposal</text><path d="M593 276 L607 276" fill="none" stroke="#58686f" stroke-width="2" marker-end="url(#block-cycle-arrow)"/><rect x="609" y="205" width="170" height="142" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="609" y="221" width="5" height="110" rx="2" fill="#16857b"/><text x="627" y="241" font-size="22" fill="#202f36" font-weight="bold">Prevote</text><text x="627" y="277" font-size="18" fill="#58686f" font-weight="normal">First vote</text><text x="627" y="303" font-size="18" fill="#58686f" font-weight="normal">and collection</text><path d="M780 276 L794 276" fill="none" stroke="#58686f" stroke-width="2" marker-end="url(#block-cycle-arrow)"/><rect x="796" y="205" width="170" height="142" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="796" y="221" width="5" height="110" rx="2" fill="#7865ad"/><text x="814" y="241" font-size="22" fill="#202f36" font-weight="bold">Precommit</text><text x="814" y="277" font-size="18" fill="#58686f" font-weight="normal">Second vote</text><text x="814" y="303" font-size="18" fill="#58686f" font-weight="normal">and quorum</text><path d="M967 276 L981 276" fill="none" stroke="#58686f" stroke-width="2" marker-end="url(#block-cycle-arrow)"/><rect x="983" y="205" width="170" height="142" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="983" y="221" width="5" height="110" rx="2" fill="#3e71a3"/><text x="1001" y="241" font-size="22" fill="#202f36" font-weight="bold">Commit</text><text x="1001" y="277" font-size="18" fill="#58686f" font-weight="normal">Apply block</text><text x="1001" y="303" font-size="18" fill="#58686f" font-weight="normal">+ persist state</text><path d="M1068 348 L1068 398 L132 398 L132 350" fill="none" stroke="#58686f" stroke-width="2" marker-end="url(#block-cycle-arrow)"/><text x="405" y="388" font-size="20" fill="#58686f" font-weight="normal">Next height, then another round</text><rect x="48" y="464" width="514" height="146" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="48" y="480" width="5" height="114" rx="2" fill="#84949d"/><text x="66" y="500" font-size="22" fill="#202f36" font-weight="bold">The measured block interval</text><text x="66" y="536" font-size="18" fill="#58686f" font-weight="normal">Consecutive canonical header timestamps.</text><text x="66" y="562" font-size="18" fill="#58686f" font-weight="normal">Compare phase sums with this pooled mean.</text><rect x="590" y="464" width="562" height="146" rx="14" fill="#fffefa" stroke="#d9dfda"/><rect x="590" y="480" width="5" height="114" rx="2" fill="#3e71a3"/><text x="608" y="500" font-size="22" fill="#202f36" font-weight="bold">The result a user sees</text><text x="608" y="536" font-size="18" fill="#58686f" font-weight="normal">Commit → RPC or indexer → application display.</text><text x="608" y="562" font-size="18" fill="#58686f" font-weight="normal">This downstream delay is outside the phase budget.</text><text x="48" y="670" font-size="20" fill="#58686f" font-weight="normal">Conditional wait states and timeout-driven retries are omitted from this successful-round schematic.</text></g></svg>